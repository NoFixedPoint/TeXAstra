<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BaKoMa revived · feasibility prototype</title><link rel="stylesheet" href="viewer.css"></head>
<body>
<header><strong>BaKoMa revived</strong><span class="badge">Feasibility prototype</span><span id="status">Ready</span></header>
<main>
<section id="source-pane"><div class="source-toolbar"><label>Source <input id="file" value="pages/page-001.tex"></label><button id="load">Open</button></div><textarea id="source" spellcheck="false" aria-label="LaTeX source"></textarea><p>Edits stay in memory in this demo. Click a glyph to select its source token; click source to locate it in the preview.</p></section>
<section id="preview-pane"><nav><button id="previous" aria-label="Previous page">←</button><label>Page <input id="page" type="number" min="1" value="1"> <span id="page-count"></span></label><button id="next" aria-label="Next page">→</button><span id="timing"></span></nav><div id="scroll"><div id="pages"></div></div><div id="location">Click a rendered token to select its source. Scroll to move through the document.</div></section>
</main><details id="diagnostics" hidden><summary id="error-title">Compile error</summary><pre id="error" role="alert"></pre></details>
<script src="viewer.js"></script></body></html>

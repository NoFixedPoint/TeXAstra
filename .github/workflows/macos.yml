name: macOS distribution
on:
  push:
    branches: [macos-distribution]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: runtime-cache
        with:
          path: native/runtime
          key: macos-runtime-v1-${{ matrix.target }}-${{ hashFiles('engine/**', 'native/**', 'texastra/**', 'scripts/build*.py', 'licenses/**') }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: engine-cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/texastra-engine-*
          key: engine-${{ matrix.target }}-${{ hashFiles('scripts/build_engine.py', 'engine/**') }}
          restore-keys: engine-${{ matrix.target }}-
      - run: python3 scripts/build_macos.py
        if: steps.runtime-cache.outputs.cache-hit != 'true'
      - run: python3 scripts/check_macos.py
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: native/runtime
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - run: python3 scripts/install_test_texlive.py --destination "$HOME/texastra-texlive-2021"
      - run: echo "$HOME/texastra-texlive-2021/bin/universal-darwin" >> "$GITHUB_PATH"
      - run: python3 -m pip install pymupdf==1.26.7
      - run: npm test
      - run: python3 scripts/check_pdftex.py
      - run: python3 scripts/check_pdftex_state.py
      - run: python3 scripts/package_extension.py --target ${{ matrix.target }}
      - run: python3 scripts/check_release_packages.py --target ${{ matrix.target }}
      - run: python3 scripts/release_macos.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: texastra-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostics-${{ matrix.target }}
          include-hidden-files: true
          path: |
            results/*.json
            ~/.cache/texastra-engine-*/build/*.log
            ~/.cache/texastra-pdftex-*/build/*.log
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.runtime-cache.outputs.cache-hit != 'true' && steps.engine-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/texastra-engine-*
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}

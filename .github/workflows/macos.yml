name: macOS distribution
on:
  push:
    branches: [macos-distribution]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: engine-cache
        with:
          path: ~/.cache/texastra-engine-*
          key: engine-${{ matrix.target }}-${{ hashFiles('scripts/build_engine.py', 'engine/**') }}
          restore-keys: engine-${{ matrix.target }}-
      - run: python3 scripts/build_macos.py
      - run: python3 scripts/check_macos.py
      - run: python3 scripts/install_test_texlive.py --destination "$HOME/texastra-texlive-2021"
      - run: echo "$HOME/texastra-texlive-2021/bin/universal-darwin" >> "$GITHUB_PATH"
      - run: python3 -m pip install pymupdf==1.26.7
      - run: npm test
      - run: python3 scripts/package_extension.py --target ${{ matrix.target }}
      - run: python3 scripts/check_release_packages.py --target ${{ matrix.target }}
      - run: python3 scripts/release_macos.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: texastra-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostics-${{ matrix.target }}
          include-hidden-files: true
          path: |
            results/*.json
            ~/.cache/texastra-engine-*/build/*.log
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.engine-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/texastra-engine-*
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: texastra-darwin-*
          path: artifacts/release
          merge-multiple: true
      - name: Publish macOS release after both native checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving published assets unchanged."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --latest \
            --title "TeXAstra $version - macOS" \
            --notes-file .github/macos-release-notes.md artifacts/release/*

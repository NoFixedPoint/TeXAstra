name: Repackage macOS release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag containing the two macOS VSIX files
        required: true
        default: v0.1.5
      arm64_sha256:
        description: Expected SHA-256 of the published Apple Silicon VSIX
        required: true
      x64_sha256:
        description: Expected SHA-256 of the published Intel VSIX
        required: true
permissions:
  contents: read
jobs:
  repackage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            asset: texastra-macos-arm64.vsix
          - runner: macos-15-intel
            target: darwin-x64
            asset: texastra-macos-x64.vsix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '${{ matrix.asset }}' --dir .work/published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
      - run: python3 scripts/restore_release_runtime.py '.work/published/${{ matrix.asset }}' --sha256 "$EXPECTED_SHA256"
        env:
          EXPECTED_SHA256: ${{ matrix.target == 'darwin-arm64' && inputs.arm64_sha256 || inputs.x64_sha256 }}
      - run: python3 scripts/check_macos.py
      - run: python3 scripts/install_test_texlive.py --destination "$HOME/texastra-texlive-2021"
      - run: echo "$HOME/texastra-texlive-2021/bin/universal-darwin" >> "$GITHUB_PATH"
      - run: python3 -m pip install pymupdf==1.26.7
      - run: npm test
      - run: python3 scripts/check_pdftex.py
      - run: python3 scripts/check_pdftex_state.py
      - run: python3 scripts/check_package_sources.py
      - run: python3 scripts/package_extension.py --target ${{ matrix.target }}
      - run: python3 scripts/check_release_packages.py --target ${{ matrix.target }}
      - run: python3 scripts/release_macos.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: texastra-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostics-${{ matrix.target }}
          path: results/*.json
          retention-days: 7
